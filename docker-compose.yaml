version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kiran
      MYSQL_DATABASE: localdb
      MYSQL_USER: kiran
      MYSQL_PASSWORD: kiran
    ports:
      - "3306:3306"
    volumes:
      - /Users/kiranbadi/projects/docker/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
  hazelcast1:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast1
    environment:
      - CLUSTER_NAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.network.interface.names=eth0
    ports:
      - "5701:5701"
  hazelcast2:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast2
    environment:
      - CLUSTER_NAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.network.interface.names=eth0
    depends_on: [ "hazelcast1" ]
  hazelcast3:
    image: hazelcast/hazelcast:5.6.0
    container_name: hazelcast3
    environment:
      - CLUSTER_NAME=dev-cluster
      - JAVA_OPTS=-Dhazelcast.network.interface.names=eth0
    depends_on: [ "hazelcast2" ]

